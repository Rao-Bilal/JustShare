name: Oracle A1 Capacity Retry

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# Prevent overlapping launch attempts from scheduled/manual runs.
concurrency:
  group: justshare-oracle-a1-launch
  cancel-in-progress: false

jobs:
  launch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI CLI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Configure SSH public key
        env:
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > ~/.ssh/justshare.pub
          chmod 644 ~/.ssh/justshare.pub

      - name: Check for existing server
        id: check
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          INSTANCE_ID=$(oci compute instance list \
            --compartment-id "$OCI_TENANCY" \
            --all \
            --query 'data[?"display-name" == `justshare-server` && "lifecycle-state" != `TERMINATED`].id | [0]' \
            --raw-output)

          if [ "$INSTANCE_ID" != "None" ] && [ -n "$INSTANCE_ID" ]; then
            echo "Server already exists: $INSTANCE_ID"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing JustShare server found."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry A1 launch until capacity is available
        if: steps.check.outputs.exists != 'true'
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          END=$((SECONDS + 20400))
          WAIT_SECONDS=120

          while [ "$SECONDS" -lt "$END" ]; do
            echo "========================================"
            echo "$(date -u): Attempting JustShare A1 launch..."
            echo "========================================"

            set +e
            OUTPUT=$(oci compute instance launch \
              --compartment-id "$OCI_TENANCY" \
              --availability-domain "lbSZ:AP-MUMBAI-1-AD-1" \
              --display-name "justshare-server" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":6}' \
              --image-id "ocid1.image.oc1.ap-mumbai-1.aaaaaaaa2jurqb3jm7hlpqw3au35loaqjkcozbyh7znn4jnfu5zbrgfulwia" \
              --subnet-id "ocid1.subnet.oc1.ap-mumbai-1.aaaaaaaaoskuzhy2z5afejah454cwisgrd2hgfdowi2ijb3p7bryo7gxg22a" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "$HOME/.ssh/justshare.pub" \
              --boot-volume-size-in-gbs 50 \
              --wait-for-state RUNNING \
              --max-wait-seconds 180 \
              2>&1)
            STATUS=$?
            set -e

            echo "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              echo "JustShare instance launched and reached RUNNING."
              exit 0
            fi

            # Capacity exhaustion and rate limiting: retry with a delay.
            if echo "$OUTPUT" | grep -Eqi \
              'Out of host capacity|"status": 429|Too many requests'; then
              echo "Temporary capacity/rate-limit error. Waiting ${WAIT_SECONDS}s."
            # Real permanent errors: stop.
            elif echo "$OUTPUT" | grep -Eqi \
              'NotAuthenticated|InvalidAuthenticationToken|NotAuthorizedOrNotFound|InvalidParameter|LimitExceeded|"status": 40[013]'; then
              echo "Permanent authentication/configuration error. Stopping retries."
              exit "$STATUS"
            else
              echo "Unrecognized launch error. Stopping to avoid retrying a permanent failure."
              exit "$STATUS"
            fi

            REMAINING=$((END - SECONDS))
            if [ "$REMAINING" -le "$WAIT_SECONDS" ]; then
              break
            fi

            sleep "$WAIT_SECONDS"
          done

          echo "Retry window ended without a running JustShare instance."
          exit 1
